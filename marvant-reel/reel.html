const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const E={lin:x=>x,o2:x=>1-(1-x)*(1-x),o3:x=>1-Math.pow(1-x,3),o4:x=>1-Math.pow(1-x,4),
 expo:x=>x>=1?1:1-Math.pow(2,-10*x),i2:x=>x*x,i3:x=>x*x*x,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 ioexpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
 back:x=>{const s=1.70158;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)}};

const S=(t,t0,w,z)=>spring(t-t0,w,z);

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`;};
function T(e,x,y,o={}){const s=o.s??1,sx=(o.sx??1)*s,sy=(o.sy??1)*s,r=o.r??0,op=o.o??1,b=o.b??0;
 e.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)${o.rx?` perspective(1400px) rotateX(${o.rx}deg)`:''}${r?` rotate(${r}deg)`:''}${o.sk?` skewY(${o.sk}deg)`:''} scale(${sx},${sy})`;
 e.style.opacity=clamp(op);e.style.filter=b>.05?`blur(${b}px)`:'none';e.style.visibility=op<=0.001?'hidden':'visible';}

 for(let i=0;i<d.data.length;i+=4){const v=rnd()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);grain.style.backgroundImage=`url(${c.toDataURL()})`;})();

<g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M110 230 v-62 a26 26 0 0 1 26-26 h200 a26 26 0 0 1 26 26 v62"/><path d="M92 200 a22 22 0 0 1 36 0 v44 h216 v-44 a22 22 0 0 1 36 0 v62 h-288 z"/><path d="M118 262 v18 M354 262 v18"/><path d="M236 142 v100"/></g>
