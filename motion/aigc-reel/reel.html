<!doctype html>
<html><head><meta charset="utf-8"><title>Marvant AIGC Reel</title>
<style>
@font-face{font-family:P;font-weight:300;src:url(f/poppins-latin-300-normal.woff2)}
@font-face{font-family:P;font-weight:500;src:url(f/poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(f/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(f/poppins-latin-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(f/poppins-latin-800-normal.woff2)}
@font-face{font-family:P;font-weight:900;src:url(f/poppins-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:400;src:url(f/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(f/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(f/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="env.js"></script>
<script>
'use strict';
const W=1080,H=1920,FPS=30,DUR=15;
const Q=new URLSearchParams(location.search);
const GUIDES=Q.has('guides');
const SUB=+(Q.get('sub')||6);           // motion-blur subframes
const SHUTTER=0.55/FPS;
// ---------- palette ----------
const C={bg0:'#07071A',bg1:'#11113A',navy:'#1C1C47',vio:'#7B5CFF',cy:'#3BE3FF',mag:'#FF4FD8',warm:'#FFB86B',white:'#FFFFFF',dim:'#A9A8D6'};
// ---------- math ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eInExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInCubic=x=>x*x*x;
const eOutBack=(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
function spring(t,f=2.2,z=0.42){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1;}
const R=(()=>{let s=12345;return()=>{s=(s*16807)%2147483647;return s/2147483647;}})();
// ---------- canvases ----------
const out=document.getElementById('c'),octx=out.getContext('2d');
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const sc=mk(),sx=sc.getContext('2d');          // subframe
const acc=mk(),ax=acc.getContext('2d');        // accumulator
const tmp=mk(),tx=tmp.getContext('2d');
const tmp2=mk(),tx2=tmp2.getContext('2d');
// grain tiles
const grains=[0,1,2,3].map(k=>{const c=mk(384,384),x=c.getContext('2d'),d=x.createImageData(384,384);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);return c;});
const noiseTile=(()=>{const c=mk(190,190),x=c.getContext('2d'),d=x.createImageData(190,190);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=v*0.8+40;d.data[i+1]=v*0.7+30;d.data[i+2]=v+20;d.data[i+3]=255;}x.putImageData(d,0,0);return c;})();
// vignette
const vig=mk();{const x=vig.getContext('2d');const g=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.62)');x.fillStyle=g;x.fillRect(0,0,W,H);}
// ---------- drawing helpers ----------
function rr(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function font(ctx,w,s,fam='P'){ctx.font=`${w} ${s}px ${fam}`;}
function grad(ctx,x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach((c,i)=>g.addColorStop(Array.isArray(c)?c[0]:i/(stops.length-1),Array.isArray(c)?c[1]:c));return g;}
function brandGrad(ctx,x0,x1,t=0,y=0){const o=(t*0.6)%1;return grad(ctx,x0-(x1-x0)*o,y,x1+(x1-x0)*(1-o),y,[C.cy,C.vio,C.mag,C.vio,C.cy]);}
function star4(ctx,x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr_=i%2?r*0.28:r;ctx.lineTo(Math.cos(a-Math.PI/2)*rr_,Math.sin(a-Math.PI/2)*rr_);}ctx.closePath();ctx.restore();}
function txtW(ctx,s){return ctx.measureText(s).width;}
// Masked rise reveal for a line of text. Returns width.
function riseText(ctx,s,x,y,size,p,{fill='#fff',align='left',weight=700,fam='P',ls=0,mask=true,blur=true}={}){
  font(ctx,weight,size,fam);ctx.letterSpacing=ls+'px';
  const w=txtW(ctx,s)-ls;let x0=align==='center'?x-w/2:align==='right'?x-w:x;
  if(p<=0){ctx.letterSpacing='0px';return w;}
  ctx.save();
  if(mask&&p<1){ctx.beginPath();ctx.rect(x0-40,y-size*1.15,w+80,size*1.5);ctx.clip();}
  const e=eOutExpo(p);
  ctx.translate(0,(1-e)*size*1.1);
  ctx.globalAlpha*=clamp(p*3);
  ctx.fillStyle=typeof fill==='function'?fill(x0,w):fill;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText(s,x0,y);
  ctx.restore();ctx.letterSpacing='0px';return w;
}
// words appearing one by one along a line
function wordsLine(ctx,words,x,y,size,t,{weight=700,align='center',fills=[],gap=0.28,ls=0}={}){
  font(ctx,weight,size);ctx.letterSpacing=ls+'px';
  const sp=size*gap,ws=words.map(w=>txtW(ctx,w[0]));const tot=ws.reduce((a,b)=>a+b,0)+sp*(words.length-1);
  let cx=align==='center'?x-tot/2:x;
  words.forEach((w,i)=>{const p=prog(t,w[1],w[1]+0.5);const f=fills[i]||'#fff';
    riseText(ctx,w[0],cx,y,size,p,{weight,fill:f==='grad'?((x0,ww)=>brandGrad(ctx,x0,x0+ww,t)):f,ls});cx+=ws[i]+sp;});
  ctx.letterSpacing='0px';return tot;
}
// ---------- Marvant mark (vectorized from supplied logo) ----------
const MARK_L=[[80.88,1.12],[107,37.88],[50.12,141.38],[2.12,141.12]];
const MARK_R=[[147.25,5.38],[221.75,141.12],[174.12,141.12],[147.88,95.75],[119.62,141.12],[74.38,141.0]];
function polyPath(ctx,pts,s,ox,oy){ctx.beginPath();pts.forEach((p,i)=>{const X=ox+p[0]*s,Y=oy+p[1]*s;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();}
// ---------- background ----------
const DUST=[...Array(140)].map(()=>({x:R()*W,y:R()*H,z:.2+R()*.8,s:R()}));
const SPH=(()=>{const n=110,a=[];for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),th=i*2.39996;a.push([Math.cos(th)*r,y,Math.sin(th)*r]);}
  const e=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const d=Math.hypot(a[i][0]-a[j][0],a[i][1]-a[j][1],a[i][2]-a[j][2]);if(d<.36)e.push([i,j]);}return{p:a,e};})();
function drawBG(ctx,t,o={}){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bg0);g.addColorStop(.55,o.mid||C.bg1);g.addColorStop(1,C.bg0);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // drifting colour blobs
  const blobs=[[C.vio,.35,.38,620,.7],[C.cy,.75,.62,520,.35],[C.mag,.2,.78,480,.28]];
  ctx.save();ctx.globalCompositeOperation='screen';
  blobs.forEach(([c,bx,by,r,a],i)=>{const x=W*(bx+.12*Math.sin(t*.5+i*2)),y=H*(by+.06*Math.cos(t*.4+i));
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,hexA(c,a*(o.blob??1)*0.55));rg.addColorStop(1,hexA(c,0));ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);});
  ctx.restore();
  if(o.grid){drawGrid(ctx,t,o.grid);}
  // dust
  ctx.save();DUST.forEach((d,i)=>{const y=((d.y-t*40*d.z)%H+H)%H,x=d.x+Math.sin(t*.7+i)*10*d.z;
    ctx.globalAlpha=(.15+.5*d.z)*(.6+.4*Math.sin(t*3+i))*(o.dust??1);ctx.fillStyle=i%7===0?C.cy:'#fff';ctx.beginPath();ctx.arc(x,y,1+d.z*2,0,7);ctx.fill();});ctx.restore();
}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function drawGrid(ctx,t,a){ // perspective floor
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=hexA(C.vio,.55);ctx.lineWidth=2;
  const hy=1240,vx=W/2;
  for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(vx+i*14,hy);ctx.lineTo(vx+i*260,H+40);ctx.stroke();}
  for(let k=0;k<14;k++){const z=((k+(t*1.2)%1))/14,y=hy+(H+40-hy)*Math.pow(z,2.2);ctx.globalAlpha=a*z;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const hg=ctx.createLinearGradient(0,hy-200,0,hy+60);hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(1,hexA(C.vio,.25));ctx.globalAlpha=a;ctx.fillStyle=hg;ctx.fillRect(0,hy-200,W,260);
  ctx.restore();
}
function drawSphere(ctx,t,cx,cy,r,a){
  const ry=t*.5,rx=.35+Math.sin(t*.3)*.1,P=SPH.p.map(([x,y,z])=>{let X=x*Math.cos(ry)+z*Math.sin(ry),Z=-x*Math.sin(ry)+z*Math.cos(ry);let Y=y*Math.cos(rx)-Z*Math.sin(rx);Z=y*Math.sin(rx)+Z*Math.cos(rx);const s=1/(1.9-Z*.6);return[cx+X*r*s*1.6,cy+Y*r*s*1.6,Z];});
  ctx.save();ctx.lineWidth=1.5;
  SPH.e.forEach(([i,j])=>{const z=(P[i][2]+P[j][2])/2;ctx.globalAlpha=a*(.15+.35*(z+1)/2);ctx.strokeStyle=z>0?C.cy:C.vio;ctx.beginPath();ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[j][0],P[j][1]);ctx.stroke();});
  P.forEach((p,i)=>{ctx.globalAlpha=a*(.3+.7*(p[2]+1)/2);ctx.fillStyle=i%9?'#fff':C.mag;ctx.beginPath();ctx.arc(p[0],p[1],2+2*(p[2]+1),0,7);ctx.fill();});
  // travelling pulses on edges
  for(let k=0;k<14;k++){const e=SPH.e[(k*37+Math.floor(t*2.3))%SPH.e.length];const u=(t*2.3)%1;const A=P[e[0]],B=P[e[1]];ctx.globalAlpha=a;ctx.fillStyle=C.cy;ctx.beginPath();ctx.arc(lerp(A[0],B[0],u),lerp(A[1],B[1],u),3.5,0,7);ctx.fill();}
  ctx.restore();
}
// ---------- generated "art" (used by image / video cards and tiles) ----------
const ART=mk(760,760);
function paintArt(c,t=0){
  const x=c.getContext('2d'),w=c.width,h=c.height;
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#120F3E');g.addColorStop(.42,'#5B3BE6');g.addColorStop(.62,'#FF6FC4');g.addColorStop(.72,'#FFB86B');g.addColorStop(1,'#1A0F3A');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  // stars
  for(let i=0;i<70;i++){x.globalAlpha=.3+.7*hash(i);x.fillStyle='#fff';x.fillRect(hash(i*3)*w,hash(i*7)*h*.4,2,2);}x.globalAlpha=1;
  // sun
  const sy=h*.6,sr=w*.17;const sg=x.createLinearGradient(0,sy-sr,0,sy+sr);sg.addColorStop(0,'#FFE29A');sg.addColorStop(1,'#FF4FD8');
  x.fillStyle=sg;x.beginPath();x.arc(w/2,sy,sr,0,7);x.fill();
  x.fillStyle='rgba(18,15,62,.9)';for(let i=0;i<6;i++){const yy=sy+sr*.15+i*sr*.15;x.fillRect(w/2-sr,yy,sr*2,2+i*1.6);}
  // Marvant-peak mountains
  const layers=[['#3A1F8F',.72,1.25,.2],['#26145F',.8,1.0,.55],['#140B38',.9,.8,.1]];
  layers.forEach(([col,base,sc_,off])=>{x.fillStyle=col;const s=w/224*sc_;const ox=w*off-w*.25,oy=h*base-141*s;
    for(let k=-1;k<3;k++){[MARK_L,MARK_R].forEach(pts=>{polyPath(x,pts,s,ox+k*224*s*1.05,oy);x.fill();});}
    x.fillRect(0,h*base-1,w,h);});
  // grid floor
  x.strokeStyle='rgba(59,227,255,.35)';x.lineWidth=1.5;for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(w/2+i*8,h*.9);x.lineTo(w/2+i*120,h);x.stroke();}
}
paintArt(ART);
// ---------- scene 1: prompt (0 - 2.25) ----------
const PROMPT='Create my next campaign';
function scene1(ctx,t){
  drawBG(ctx,t,{grid:.55});
  // caption
  const c1=t;
  wordsLine(ctx,[['What',.2],['if',.36],['your',.48]],W/2,640,88,c1,{weight:600});
  wordsLine(ctx,[['content…',.62]],W/2,750,110,c1,{weight:800});
  wordsLine(ctx,[['created',1.3],['itself?',1.55]],W/2,880,118,c1,{weight:900,fills:['grad','grad']});
  // prompt box
  const pe=spring(t-.05,1.6,.55);
  const bw=860,bh=150,bx=W/2-bw/2,by=1070;
  ctx.save();ctx.globalAlpha=clamp(pe*1.5);
  ctx.translate(W/2,by+bh/2);const sq=1+(1-pe)*-.12;ctx.scale(sq,sq);ctx.translate(0,(1-pe)*120);ctx.translate(-W/2,-(by+bh/2));
  // glow
  ctx.save();ctx.shadowColor=hexA(C.vio,.8);ctx.shadowBlur=60;ctx.fillStyle='rgba(20,18,60,.85)';rr(ctx,bx,by,bw,bh,bh/2);ctx.fill();ctx.restore();
  // rotating gradient border
  const a=t*2.2,cx=W/2,cy=by+bh/2;const bg_=ctx.createLinearGradient(cx+Math.cos(a)*500,cy+Math.sin(a)*500,cx-Math.cos(a)*500,cy-Math.sin(a)*500);
  bg_.addColorStop(0,C.cy);bg_.addColorStop(.5,'rgba(123,92,255,.25)');bg_.addColorStop(1,C.mag);
  ctx.strokeStyle=bg_;ctx.lineWidth=3.5;rr(ctx,bx,by,bw,bh,bh/2);ctx.stroke();
  // sparkle icon
  ctx.fillStyle=brandGrad(ctx,bx+40,bx+110,t);star4(ctx,bx+80,cy,30,t*1.5);ctx.fill();
  // typed text
  const n=clamp(Math.floor((t-.42)/.05)+1,0,PROMPT.length);
  font(ctx,500,40,'M');ctx.fillStyle=n?'#fff':C.dim;ctx.textBaseline='middle';
  const s=n?PROMPT.slice(0,n):'Ask AI anything…';ctx.globalAlpha*=n?1:.5;ctx.fillText(s,bx+130,cy+2);ctx.globalAlpha=clamp(pe*1.5);
  const tw=n?txtW(ctx,s):0;if(Math.floor(t*3.2)%2===0||(t>.4&&t<1.6)){ctx.fillStyle=C.cy;ctx.fillRect(bx+134+tw,cy-24,4,48);}
  // send button
  const press=t>1.86?1-.18*Math.sin(clamp((t-1.86)/.16)*Math.PI):1;
  const sbx=bx+bw-75;ctx.save();ctx.translate(sbx,cy);ctx.scale(press,press);
  ctx.fillStyle=brandGrad(ctx,-50,50,t);ctx.beginPath();ctx.arc(0,0,52,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(0,-20);ctx.moveTo(-16,-4);ctx.lineTo(0,-20);ctx.lineTo(16,-4);ctx.stroke();
  ctx.restore();
  // ripple
  if(t>1.88){const k=prog(t,1.88,2.25);ctx.strokeStyle=hexA(C.cy,1-k);ctx.lineWidth=6*(1-k)+1;ctx.beginPath();ctx.arc(sbx,cy,52+k*220,0,7);ctx.stroke();}
  ctx.restore();
  // label chip above box
  const lp=prog(t,.15,.6);ctx.save();ctx.globalAlpha=eOutCubic(lp)*.9;font(ctx,500,28,'M');ctx.letterSpacing='6px';ctx.fillStyle=C.cy;ctx.textAlign='center';
  ctx.fillText('MARVANT · AIGC STUDIO',W/2,1030+(1-eOutCubic(lp))*20);ctx.restore();ctx.letterSpacing='0px';
  return {focus:[bx+bw-75,by+bh/2]};
}
// ---------- scene 2: AIGC (2.25 - 5.25) ----------
const AIGC=[['A','rtificial',2.64,3.70],['I','ntelligence',2.89,3.86],['G','enerated',3.13,4.22],['C','ontent',3.36,4.74]];
function scene2(ctx,t){
  drawBG(ctx,t,{blob:1.2,mid:'#0E0E33'});
  const sa=prog(t,2.3,2.9)*(1-prog(t,5.0,5.25));
  drawSphere(ctx,t,W/2,930,330,sa*.55);
  // shockwave
  const k=prog(t,2.25,2.85);if(k<1){ctx.save();ctx.strokeStyle=hexA('#ffffff',(1-k)*.9);ctx.lineWidth=40*(1-k)+2;ctx.beginPath();ctx.arc(W/2,930,30+eOutCubic(k)*900,0,7);ctx.stroke();
    ctx.strokeStyle=hexA(C.cy,(1-k)*.7);ctx.lineWidth=10*(1-k);ctx.beginPath();ctx.arc(W/2,930,10+eOutCubic(k)*600,0,7);ctx.stroke();ctx.restore();}
  // "MEET" label
  ctx.save();const mp=prog(t,2.3,2.7)*(1-prog(t,3.6,3.8));ctx.globalAlpha=eOutCubic(mp);font(ctx,500,34,'M');ctx.letterSpacing='14px';ctx.fillStyle=C.cy;ctx.textAlign='center';
  ctx.fillText('MEET',W/2+7,700-(1-eOutCubic(mp))*20);ctx.restore();ctx.letterSpacing='0px';
  // layout targets
  const big=270,small=112;
  font(ctx,900,big);const bw=AIGC.map(a=>txtW(ctx,a[0]));const bgap=18,btot=bw.reduce((a,b)=>a+b,0)+bgap*3;
  font(ctx,800,small);const rowW=AIGC.map(a=>txtW(ctx,a[0]+a[1]));const maxW=Math.max(...rowW);const left=W/2-maxW/2;
  const u=eInOut(prog(t,3.6,4.05));  // unfold progress
  let bx=W/2-btot/2;
  const exit=prog(t,4.98,5.25);
  AIGC.forEach((a,i)=>{
    const slam=prog(t,a[2],a[2]+.2);if(slam<=0){bx+=bw[i]+bgap;return;}
    const s0=lerp(2.4,1,eOutExpo(slam));
    const ax_=bx+bw[i]/2, ay=1000;  // big pos (center x, baseline)
    const ty=650+i*150; // row baseline
    font(ctx,800,small);const lw=txtW(ctx,a[0]);
    const tx_=left+lw/2;
    const cx=lerp(ax_,tx_,u),cy=lerp(ay,ty,u);const size=lerp(big,small,u);
    const ex=eInExpo(clamp(exit*1.6-i*.15));
    ctx.save();ctx.translate(cx-ex*1300,cy);ctx.scale(s0,s0);
    ctx.globalAlpha=clamp(slam*4);
    font(ctx,u>.5?800:900,size);ctx.textAlign='center';
    // RGB split right after slam
    const gl=(1-prog(t,a[2],a[2]+.22))*14;
    if(gl>.5){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,40,120,.8)';ctx.fillText(a[0],-gl,0);ctx.fillStyle='rgba(40,220,255,.8)';ctx.fillText(a[0],gl,0);ctx.globalCompositeOperation='source-over';}
    const lw2=txtW(ctx,a[0]);ctx.fillStyle=brandGrad(ctx,-lw2/2,lw2/2,t+i*.25);ctx.fillText(a[0],0,0);
    ctx.restore();
    // rest of word
    if(u>0){const rp=prog(t,a[3],a[3]+.45);ctx.save();ctx.translate(-ex*1300,0);
      font(ctx,800,small);const rx=left+lw+2;
      if(rp>0){ctx.save();ctx.beginPath();ctx.rect(rx-4,ty-small,(txtW(ctx,a[1])+20)*eOutExpo(rp),small*1.4);ctx.clip();
        ctx.fillStyle='#fff';ctx.globalAlpha=clamp(rp*2);ctx.fillText(a[1],rx-(1-eOutExpo(rp))*60,ty);ctx.restore();
        // wipe bar
        if(rp<1){ctx.fillStyle=C.cy;ctx.fillRect(rx+(txtW(ctx,a[1])+20)*eOutExpo(rp)-6,ty-small*.8,6,small*.95);}
      }
      ctx.restore();}
    bx+=bw[i]+bgap;
  });
  // underline accent under block
  const ul=prog(t,4.75,5.1);if(ul>0){ctx.fillStyle=brandGrad(ctx,left,left+maxW,t);ctx.fillRect(left,1235,maxW*eOutExpo(ul)*(1-exit),8);}
}

// ---------- composition ----------
const IMPACTS=[[2.25,1],[2.64,.35],[2.89,.35],[3.13,.35],[3.36,.4],[8.62,.5],[9.75,.6],[12.5,1]];

function post(t,f){

window.renderFrame=function(f){
