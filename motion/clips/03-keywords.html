<title>03 Keyword dashboard</title>
<style>
.mut{color:#8A8782}
.kr{position:absolute;left:0;top:0;width:0;height:0}
.kr .kw{position:absolute;left:-400px;top:28px;font-size:36px;font-weight:500;white-space:nowrap;letter-spacing:-.01em}
.kr .tk{position:absolute;left:90px;top:44px;width:270px;height:16px;border-radius:8px;background:#EDEAE5}
.kr .fl{position:absolute;left:90px;top:44px;height:16px;border-radius:8px;background:#0B0B0B}
.kr .ok{position:absolute;left:384px;top:32px;width:40px;height:40px;border-radius:50%;background:#8192e3;display:flex;align-items:center;justify-content:center}
</style>
<div data-slot="shape">
  <div class="L" id="Ldash">
    <div class="row" style="left:-400px;top:50px;gap:16px;font-size:40px;font-weight:650;letter-spacing:-.02em"><span id="icQ"></span>Keywords</div>
    <div class="row" id="btn" style="left:110px;top:36px;width:290px;height:80px;border-radius:40px;background:#0B0B0B;color:#fff;font-size:30px;font-weight:600;justify-content:center;gap:12px"><span id="icB"></span><span id="btnT">Find keywords</span></div>
    <div class="a mut" style="left:-400px;top:168px;font-size:24px;font-weight:500;letter-spacing:.06em">KEYWORD</div>
    <div class="a mut" style="left:90px;top:168px;font-size:24px;font-weight:500;letter-spacing:.06em">CONVERSION</div>
    <div class="a" style="left:-420px;top:210px;width:840px;height:2px;background:#EAE7E2"></div>
    <div class="a" id="hl" style="left:-430px;top:226px;width:860px;height:104px;border-radius:26px;background:#EEF0FB"></div>
    <div id="rows"></div>
    <div class="a" id="isl" style="top:1030px;height:120px;border-radius:60px;background:#0B0B0B"></div>
    <div class="row" id="islT" style="left:0;top:1030px;height:120px;transform:translateX(-50%);gap:18px;color:#fff;font-size:42px;font-weight:600;letter-spacing:-.02em"><span id="icC"></span><span id="mins">Minutes</span><span id="wks" style="color:#8A8782;font-weight:500;position:relative">not weeks<i id="strike" style="position:absolute;left:0;top:27px;height:4px;border-radius:2px;background:#8192e3"></i></span></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const P='#8192e3';
$('icQ').innerHTML=M.icon('search',40,P,2.6); $('icB').innerHTML=M.icon('sparkle',28,'#fff'); $('icC').innerHTML=M.icon('clock',42,P,2.6);
// clip-local word times: uncovers 0.41, highest 1.13, converting 1.54, keywords 2.11, minutes 2.73, not 3.15, weeks 3.36
// keywords and conversion bars are illustrative
const KW=[['seo services malaysia',.55],['ai seo agency',.92],['local seo kl',.38],['seo for e-commerce',.70],['google ranking help',.26],['best seo company',.62]];
const RANK=KW.map(([,v])=>KW.filter(([,w])=>w>v).length);
$('rows').innerHTML=KW.map(([k],i)=>`<div class="kr" id="r${i}"><div class="kw">${k}</div><div class="tk"></div><div class="fl"></div><div class="ok"></div></div>`).join('');
KW.forEach((_,i)=>$('r'+i).querySelector('.ok').innerHTML=M.icon('check',24,'#fff',3.4));
const ROWY=s=>220+s*118, RIN=i=>0.55+0.08*i, SORT=1.54;
const rowY=KW.map((_,i)=>M.track(ROWY(i),[[SORT+0.04*RANK[i],ROWY(RANK[i]),M.FAST]]));
const btnP=M.track(0,[[0.34,1,[45,1]],[0.45,0,[22,.72]]]);
const islW=M.track(0,[[2.73,350,[16,0.8]],[3.36,640,[16,0.8]]]);
M.scene({
  W:1080,H:1920,bg:'#E9E7E2',T:4.40,intro:null,camSpring:M.MORPH,
  SH:{prev:{w:820,h:600,r:60,bg:'#0B0B0B',cam:1.05}, dash:{w:900,h:1240,r:48,bg:'#FFFFFF',cam:1.0}},
  start:'prev', SEQ:[[0.02,'dash']],
  layers:[
    {el:'Ldash',tin:0.05,tout:4.22,anchor:'t',o:{lout:0.15},update:(t)=>{
      const b=$('btn').style; b.transform=`scale(${1-0.06*btnP(t)})`; b.background=t>0.41?P:'#0B0B0B';
      KW.forEach(([,v],i)=>{
        const r=$('r'+i), vi=M.vis(t,RIN(i),null,{din:0,lin:0.22});
        r.style.opacity=vi.o; r.style.filter=vi.blur>0.05?`blur(${vi.blur}px)`:'none';
        r.style.transform=`translateY(${rowY[i](t)+(1-vi.a)*16}px)`;
        const fl=r.querySelector('.fl'); fl.style.width=(270*v*M.eio((t-RIN(i)-0.1)/0.5))+'px';
        const top=RANK[i]===0; fl.style.background=top&&t>SORT+0.2?P:'#0B0B0B';
        const ok=M.S(t-2.11,17,0.7); r.querySelector('.ok').style.transform=`scale(${top?Math.max(0,ok):0})`;
      });
      const h=M.vis(t,SORT+0.25,null,{din:0,lin:0.25}); $('hl').style.opacity=h.o; $('hl').style.transform=`scaleX(${0.96+0.04*h.a})`;
      const w=Math.max(0,islW(t)); Object.assign($('isl').style,{left:(-w/2)+'px',width:w+'px',display:w<1?'none':''});
      const mv=M.vis(t,2.78,null,{din:0,lin:0.2}); $('islT').style.opacity=mv.o;
      const wv=M.vis(t,3.36,null,{din:0.05,lin:0.2}); $('wks').style.opacity=wv.o; $('wks').style.display=t<3.36?'none':'';
      $('strike').style.width=($('wks').offsetWidth*M.eio((t-3.62)/0.3))+'px';
    }},
  ],
  cursor:{size:54,clicks:[0.41],keys:[[0,340,520],[0.05,340,520],[0.36,262,-540],[0.5,262,-540],[1.3,330,-200],[2.0,-40,-330],[2.5,-40,-330],[3.1,400,330]]},
});
</script>
